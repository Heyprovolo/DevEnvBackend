# Staging / dev Fly app (devenvbackend). Deploy with:
#   fly deploy -c staging_fly.toml
#
# Production uses fly.toml (provolo-backend). See https://fly.io/docs/reference/configuration/

app = 'devenvbackend'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Avoid cold-start races: proxy was hitting the machine before Node listened (PR03/PC01).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
